apply plugin: 'com.android.library'

repositories {
    google()
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

configurations.named('implementation') {
    exclude group: 'org.jetbrains', module: 'annotations'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    annotationProcessor 'org.immutables:value:2.12.3'
    api 'org.immutables:value-annotations:2.12.3'
    annotationProcessor project(':xmpp-core:annotation-processor')
    implementation project(':xmpp-core:annotation')

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.concurrent:concurrent-futures:1.3.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.emoji2:emoji2:1.6.0'
    implementation 'androidx.emoji2:emoji2-bundled:1.6.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.heifwriter:heifwriter:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.sharetarget:sharetarget:1.2.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'com.github.open-keychain.open-keychain:openpgp-api:v5.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.guava:guava:33.7.2-android'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    // Telegram ships its own org.webrtc classes, so calls stay out of the app until the calls phase.
    compileOnly 'im.conversations.webrtc:webrtc-android:149.0.0'
    implementation 'io.deepmedia.community:transcoder-android:0.11.2'
    implementation 'me.leolin:ShortcutBadger:1.1.22@aar'
    implementation 'net.fellbaum:jemoji:1.7.6'
    implementation 'org.bouncycastle:bcmail-jdk18on:1.86'
    implementation 'org.conscrypt:conscrypt-android:2.7.0'
    implementation 'org.hsluv:hsluv:1.0.2'
    api 'org.jxmpp:jxmpp-jid:1.1.0'
    implementation 'org.jxmpp:jxmpp-stringprep-libidn:1.1.0'
    implementation 'org.minidns:minidns-client:1.1.3'
    implementation 'org.minidns:minidns-dnssec:1.1.3'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    implementation 'org.whispersystems:signal-protocol-java:2.6.2'
}

android {
    namespace = 'eu.siacs.conversations'
    compileSdk = 36

    defaultConfig {
        minSdk = 23
        resValue('string', 'applicationId', 'app.phogram')
        resValue('string', 'app_name', 'Phogram')
        buildConfigField('String', 'APP_NAME', '"Phogram"')
        buildConfigField('String', 'PRIVACY_POLICY', '""')
        buildConfigField('String', 'FLAVOR', '"conversationsFree"')
        buildConfigField('String', 'FLAVOR_mode', '"conversations"')
        buildConfigField('String', 'FLAVOR_distribution', '"free"')
        buildConfigField('int', 'VERSION_CODE', '42183')
        buildConfigField('String', 'VERSION_NAME', '"2.21.0"')
        buildConfigField('String', 'APPLICATION_ID', '"app.phogram"')
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xmaxerrs', '3000']
    }
}
