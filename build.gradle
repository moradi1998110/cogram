// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.0'
        // OsmAnd's engine (phase 0 of the Maps tab) needs its own Kotlin and plugins; see settings.gradle.
        if (file('osmand/android/OsmAnd').exists()) {
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20"
            classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.20"
            classpath "org.jetbrains.kotlin:kotlin-serialization:2.1.20"
            classpath "de.undercouch:gradle-download-task:5.7.0"
        } else {
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0"
        }
    }
}

if (gradle.ext.has('osmand')) {
    ext.kotlin_version = '2.1.20'
    // OsmAnd's scripts use the Download task type this plugin publishes from the root project.
    apply plugin: 'de.undercouch.download'

    // OsmAnd's libraries come from its own binary store and from JitPack.
    allprojects {
        repositories {
            ivy {
                name = "OsmAndBinariesIvy"
                url = "https://builder.osmand.net"
                patternLayout {
                    artifact "ivy/[organisation]/[module]/[revision]/[artifact]-[revision].[ext]"
                }
                metadataSources { artifact() }
            }
            google()
            mavenCentral()
            maven { url "https://jitpack.io" }
        }
    }

    // One OsmAnd variant per build: its legacy (non-OpenGL) renderer, for the ABI the build is for.
    def injectedAbi = (findProperty('android.injected.build.abi') ?: '').toString()
    def osmandAbi = injectedAbi.contains('arm64') ? 'arm64' : injectedAbi.contains('x86') ? 'x86' : 'fat'
    def osmandProjects = [':OsmAnd', ':OsmAnd-java', ':OsmAnd-api', ':OsmAnd-shared']
    subprojects { p ->
        if (osmandProjects.contains(p.path)) return
        ['com.android.application', 'com.android.library'].each { id ->
            p.plugins.withId(id) {
                p.android.defaultConfig {
                    missingDimensionStrategy 'coreversion', 'legacy'
                    missingDimensionStrategy 'abi', osmandAbi
                }
                // OsmAnd supports Android 7 and newer; this wins over the minSdkVersion the module sets later.
                p.androidComponents.beforeVariants(p.androidComponents.selector().all()) { v -> v.minSdk = 24 }
            }
        }
        // OsmAnd brings BouncyCastle for Java 1.5; Phogram already ships the Java 1.8 build of the same classes.
        p.configurations.configureEach {
            exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
            exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
            exclude group: 'org.bouncycastle', module: 'bcutil-jdk15on'
        }
    }

    // OsmAnd's native renderer is built for the device's ABI only, not for all four.
    project(':OsmAnd') {
        // OsmAnd compiles its Java for 17 and leaves Kotlin on the JDK's own level, which on Phogram's CI is 21.
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
            compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
        tasks.configureEach { t ->
            // OsmAnd's script (written for Android plugin 8.10) orders its icon copy before the resource tasks
            // it knows; newer resource tasks, such as navigation resources, read those icons too.
            if (t.name != 'copyIcons' && t.name.endsWith('Resources') && !t.name.startsWith('collect')) {
                t.dependsOn('copyIcons')
            }
            if (t.name == 'buildOsmAndCore') {
                if (injectedAbi.contains('arm64')) t.environment('ARM64_ONLY', '1')
                else if (injectedAbi.contains('x86_64')) t.environment('X86_64_ONLY', '1')
            }
        }
    }
}
repositories {
    google()
}

// Strip JLatexMath fonts we don't ship (transitive AAR assets from
// io.noties.markwon:ext-latex -> ru.noties:jlatexmath-android, ~764 KB total under
// assets/org/scilab/forge/jlatexmath/fonts/). Has to live in the APK modules — a
// library's androidResources.ignoreAssetsPattern doesn't filter packaging in apps
// that consume it. Using subprojects keeps it in one place.
//   keep:  base/, latin/, maths/, euler/  (\mathbb, \mathcal, \mathfrak still work)
//   drop:  latin/optional/, maths/optional/  (~290 KB; \textbf/\textit/\mathds fall back)
//          licences/                          (~20 KB; pure license text files)
subprojects {
    plugins.withId('com.android.application') {
        android {
            androidResources {
                ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~:!optional:!licences:!*stmary*:!*eufb*'
            }
        }
    }

    if (project.projectDir.absolutePath.contains('/TMessagesProj_Modules/media/')) {
        project.plugins.withId('com.android.library') {
            project.android {
                if (namespace == null) {
                    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")

                    if (manifestFile.exists()) {
                        def manifest = new XmlSlurper().parse(manifestFile)
                        def manifestPackage = manifest.@package.text()

                        if (manifestPackage) {
                            namespace manifestPackage
                        }
                    }
                }
            }
        }
    }
}