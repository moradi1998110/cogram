apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'

repositories {
    mavenCentral()
    google()
    maven {
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.open-keychain.open-keychain' }
    }
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    // Telegram's update sheet, used here, is built on AndroidX classes the app already carries through the main
    // module (core 1.16.0, and the fragment library under appcompat 1.7.0); declared for compiling only.
    compileOnly 'androidx.core:core:1.16.0'
    compileOnly 'androidx.fragment:fragment:1.5.4'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig.applicationId = APP_PACKAGE


    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    signingConfigs {
        // Phogram's own key comes from the environment so it never enters the repository. Builds that
        // are not installed on phones, such as the compile check and the emulator run, use Telegram's key.
        debug {
            def phogramKeystore = System.getenv('PHOGRAM_KEYSTORE_FILE')
            if (phogramKeystore) {
                storeFile file(phogramKeystore)
                storeType 'pkcs12'
                storePassword System.getenv('PHOGRAM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PHOGRAM_KEY_ALIAS')
                keyPassword System.getenv('PHOGRAM_KEYSTORE_PASSWORD')
            } else {
                storeFile file("../TMessagesProj/config/release.keystore")
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }

        release {
            // Production builds are signed with Phogram's key too, so they install over the test builds and reach phones
            // as updates; Telegram's key only where Phogram's is not given (local builds).
            def phogramKeystore = System.getenv('PHOGRAM_KEYSTORE_FILE')
            if (phogramKeystore) {
                storeFile file(phogramKeystore)
                storeType 'pkcs12'
                storePassword System.getenv('PHOGRAM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PHOGRAM_KEY_ALIAS')
                keyPassword System.getenv('PHOGRAM_KEYSTORE_PASSWORD')
            } else {
                storeFile file("../TMessagesProj/config/release.keystore")
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/BCKEY.DSA', 'META-INF/BCKEY.SF', 'META-INF/LICENSE.md', 'META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
        // Native libraries and code stay uncompressed and page-aligned in the APK, so Android runs them from
        // it instead of unpacking a second copy at install (about 50 MB of libraries and 30 MB of code).
        // The APK grows, but releases also go out gzipped, so the download does not.
        jniLibs {
            useLegacyPackaging = false
        }
        dex {
            useLegacyPackaging = false
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro', 'cogram-debug-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        standalone {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            applicationIdSuffix ".web"
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            // Phogram's production rules: logging calls removed, the rest as the engines need (cogram-release-rules.pro).
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro', 'cogram-release-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest.xml'
    }

    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    sourceSets.release {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        bundleAfat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            ext {
                abiVersionCode = 1
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        afat {
            ndk {
                // A build for one device ABI also leaves out the other ABIs' prebuilt libraries.
                def injectedAbi = project.findProperty('android.injected.build.abi')
                if (injectedAbi) {
                    abiFilters(*injectedAbi.toString().split(','))
                } else {
                    abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                }
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
            ext {
                abiVersionCode = 9
            }
            buildConfigField "boolean", "BUNDLE", "false"
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        // A release takes its own version name (0.0.27 from the tag v0.0.27); other builds keep Telegram's.
        versionName (project.findProperty("PHOGRAM_VERSION_NAME") ?: APP_VERSION_NAME)
        // Where the app finds its updates inside the organization: update.json in the releases project on GitLab,
        // given to release builds (-PPHOGRAM_UPDATE_URL=...); empty in other builds, which then never look.
        buildConfigField "String", "UPDATE_URL", "\"" + (project.findProperty("PHOGRAM_UPDATE_URL") ?: "") + "\""
        // The weather on the routes: the index of the weather tiles beside the updates (.github/workflows/weather.yml),
        // given to every build of the workflows (-PPHOGRAM_WEATHER_URL=...); empty elsewhere, which shows no weather.
        buildConfigField "String", "WEATHER_URL", "\"" + (project.findProperty("PHOGRAM_WEATHER_URL") ?: "") + "\""
        // Where the organization's XMPP server is reached on networks without DNS for its domain, after the DNS:
        // a host name or IP and its port (-PPHOGRAM_XMPP_HOST=..., -PPHOGRAM_XMPP_PORT=...), from the workflows'
        // variables; empty for none. The certificate must still be the domain's.
        def xmppHost = (project.findProperty("PHOGRAM_XMPP_HOST") ?: "").toString().replaceAll('[^A-Za-z0-9.:\\[\\]-]', '')
        def xmppPort = (project.findProperty("PHOGRAM_XMPP_PORT") ?: "5222").toString()
        if (!xmppPort.isInteger()) xmppPort = "5222"
        buildConfigField "String", "XMPP_FALLBACK_HOST", "\"" + xmppHost + "\""
        buildConfigField "int", "XMPP_FALLBACK_PORT", xmppPort
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-23' // , '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.regular'

    lintOptions {
        checkReleaseBuilds false
    }
}

// OsmAnd's core library (the Maps tab's search and routing) reads some of its classes by reflection.
if (gradle.ext.has('osmand')) {
    android.buildTypes.each { it.proguardFiles 'osmand-rules.pro' }
}
