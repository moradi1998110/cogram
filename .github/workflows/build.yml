name: Build APK

# A release is made on GitHub's Releases page ("Draft a new release", a new tag v..., the notes, Publish), which
# builds it and sends it to the organization's GitLab; a v tag pushed with git still works the same way. A release
# published for a tag pushed with git is built once (see concurrency). build* tags are test builds.
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - 'build*'
      - 'prod*'

# One build per release: making a release on GitHub also creates its tag, and both start this workflow; the later
# one replaces the earlier, so a release is built and sent to GitLab once.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      NDK_VERSION: 27.2.12479018
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPRESS: 'true'
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install native toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null

      # The osmand-poc branch builds OsmAnd's map engine into the Maps tab.
      - name: Fetch OsmAnd
        run: bash .github/scripts/fetch-osmand.sh

      # Private repository runners have 7 GB of memory, and R8 needs more with the build around it.
      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/cogram-swap
          sudo chmod 600 /mnt/cogram-swap
          sudo mkswap /mnt/cogram-swap
          sudo swapon /mnt/cogram-swap
          free -h

      - name: Limit Gradle memory for the runner
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.parallel=false"
          } >> ~/.gradle/gradle.properties

      # Filled by native-cache.yml on main, because caches saved from tag runs are visible only to that tag.
      - name: Restore native object cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ env.NDK_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.NDK_VERSION }}-

      # Release tags must be signed with Phogram's key so they install over earlier releases.
      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOGRAM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PHOGRAM_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Phogram signing secrets are not set"
            case "$GITHUB_REF" in refs/tags/v*) exit 1;; esac
            exit 0
          fi
          # Values pasted into the secrets page can pick up spaces and line breaks, which neither value contains.
          KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \t\r\n')
          echo "::add-mask::$KEYSTORE_PASSWORD"
          export KEYSTORE_PASSWORD
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/phogram-windows.p12"
          echo "Keystore SHA-256: $(sha256sum "$RUNNER_TEMP/phogram-windows.p12" | cut -d' ' -f1)"
          # The key was exported by Windows with legacy encryption, so it is rewritten in a format Java reads.
          if ! openssl pkcs12 -legacy -in "$RUNNER_TEMP/phogram-windows.p12" -passin env:KEYSTORE_PASSWORD -noout; then
            echo "The password secret does not open the keystore secret"
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/phogram.p12"
          openssl pkcs12 -legacy -in "$RUNNER_TEMP/phogram-windows.p12" -passin env:KEYSTORE_PASSWORD -nodes \
            | openssl pkcs12 -export -name phogram -passout env:KEYSTORE_PASSWORD -out "$KEYSTORE"
          rm "$RUNNER_TEMP/phogram-windows.p12"
          LISTING=$(keytool -list -keystore "$KEYSTORE" -storetype pkcs12 -storepass "$KEYSTORE_PASSWORD" 2>&1) || true
          ALIAS=$(printf '%s\n' "$LISTING" | grep -m1 PrivateKeyEntry | cut -d, -f1)
          if [ -z "$ALIAS" ]; then
            printf '%s\n' "$LISTING"
            exit 1
          fi
          {
            echo "PHOGRAM_KEYSTORE_FILE=$KEYSTORE"
            echo "PHOGRAM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PHOGRAM_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      # Two kinds of build:
      #  - production (tags v*, which go to the organization's phones, and prod* to try one first): the release
      #    build type, not debuggable, without Telegram's debug flags and with the logging calls removed;
      #  - test (build*): the debug build with its logs, for the emulator check and diagnosis, kept on GitHub.
      # A release (v*) also gets a version code above every earlier one, as Android installs only higher codes over
      # an installed app, its version name, and the address of update.json on the organization's GitLab. Other
      # builds have no update address, so they never look for updates.
      - name: Build arm64 APK
        env:
          GITLAB_API_URL: ${{ vars.GITLAB_API_URL || secrets.GITLAB_API_URL }}
          GITLAB_RELEASES_PROJECT: ${{ vars.GITLAB_RELEASES_PROJECT || secrets.GITLAB_RELEASES_PROJECT }}
        run: |
          chmod +x gradlew
          EXTRA=""
          TASK=":TMessagesProj_App:assembleAfatDebug"
          case "$GITHUB_REF" in
            refs/tags/v*)
              TASK=":TMessagesProj_App:assembleAfatRelease"
              EXTRA="-PAPP_VERSION_CODE=$((8000 + GITHUB_RUN_NUMBER)) -PPHOGRAM_VERSION_NAME=${GITHUB_REF_NAME#v}"
              if [ -n "$GITLAB_API_URL" ] && [ -n "$GITLAB_RELEASES_PROJECT" ]; then
                EXTRA="$EXTRA -PPHOGRAM_UPDATE_URL=${GITLAB_API_URL%/}/projects/$GITLAB_RELEASES_PROJECT/packages/generic/phogram/latest/update.json"
              fi
              ;;
            refs/tags/prod*)
              TASK=":TMessagesProj_App:assembleAfatRelease"
              ;;
          esac
          echo "Build: $TASK $EXTRA"
          ./gradlew --no-daemon --stacktrace \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.injected.testOnly=false \
            $EXTRA \
            $TASK

      - name: Show cache statistics
        if: always()
        run: ccache -s || true

      # The output folder depends on the injected ABI option, so locate the APK instead of naming it.
      - name: Collect APK
        run: |
          mkdir -p dist
          find TMessagesProj_App/build -type f -name '*.apk' -print
          APK=$(find TMessagesProj_App/build -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" dist/phogram-arm64.apk

      # Package installers reject a testOnly APK as invalid, and the injected ABI option turns that flag on by default.
      - name: Check the APK can be installed
        run: |
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs dist/phogram-arm64.apk | grep -v "Signer #1 public key"
          "$TOOLS/aapt2" dump badging dist/phogram-arm64.apk | head -3
          if "$TOOLS/aapt2" dump xmltree --file AndroidManifest.xml dist/phogram-arm64.apk | grep -E 'android:testOnly.*=(true|-1|0xffffffff)'; then
            echo "APK is marked testOnly"
            exit 1
          fi
          # A production build must never be debuggable: anyone with a cable could then read the app's data.
          case "$GITHUB_REF" in
            refs/tags/v*|refs/tags/prod*)
              if "$TOOLS/aapt2" dump xmltree --file AndroidManifest.xml dist/phogram-arm64.apk | grep -E 'android:debuggable.*=(true|-1|0xffffffff)'; then
                echo "Production APK is debuggable"
                exit 1
              fi
              echo "Production APK: not debuggable"
              ;;
          esac

      # A production build's R8 mapping, kept on GitHub only, turns the shortened names of a crash report back.
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/prod')
        with:
          name: phogram-mapping
          path: TMessagesProj_App/build/outputs/mapping/
          retention-days: 90
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: phogram-arm64
          path: dist/phogram-arm64.apk
          retention-days: 14
          if-no-files-found: error

      # A release made on GitHub's Releases page already exists: the APK is added to it. A tag pushed with git gets
      # a draft release of its own.
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/phogram-arm64.apk "phogram-${GITHUB_REF_NAME}-arm64.apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "phogram-${GITHUB_REF_NAME}-arm64.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "phogram-${GITHUB_REF_NAME}-arm64.apk" \
              --draft --prerelease --title "$GITHUB_REF_NAME" --notes "Automated build of $GITHUB_SHA"
          fi

      # The release goes to the releases project on the organization's GitLab, where the app finds it: the APK as a
      # generic package of its version, then update.json (version, code, SHA-256, what is new) as the "latest" one.
      # What is new is the tag's message; a line "[required]" in it makes every older version update before going on.
      - name: Publish the release to GitLab
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITLAB_API_URL: ${{ vars.GITLAB_API_URL || secrets.GITLAB_API_URL }}
          GITLAB_RELEASES_PROJECT: ${{ vars.GITLAB_RELEASES_PROJECT || secrets.GITLAB_RELEASES_PROJECT }}
          GITLAB_RELEASES_TOKEN: ${{ secrets.GITLAB_RELEASES_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$GITLAB_API_URL" ] || [ -z "$GITLAB_RELEASES_PROJECT" ] || [ -z "$GITLAB_RELEASES_TOKEN" ]; then
            echo "The GitLab releases project is not set up; the release stays on GitHub only."
            exit 0
          fi
          API="${GITLAB_API_URL%/}/projects/$GITLAB_RELEASES_PROJECT/packages/generic/phogram"
          VERSION="${GITHUB_REF_NAME#v}"
          APK="phogram-$VERSION.apk"
          cp dist/phogram-arm64.apk "$APK"
          CODE=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          # What is new: the text of the release written on GitHub's Releases page, else the tag's message.
          NOTES=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body 2>/dev/null | tr -d '\r' || true)
          case "$NOTES" in "Automated build of"*) NOTES="";; esac
          if [ -z "$NOTES" ]; then
            git fetch -q --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" || true
            NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN PGP/,$d')
          fi
          MIN=0
          if printf '%s' "$NOTES" | grep -q '^\[required\]'; then MIN=$CODE; fi
          NOTES=$(printf '%s\n' "$NOTES" | grep -v '^\[required\]')
          echo "Version $VERSION, code $CODE, SHA-256 $SHA, minimum $MIN"
          curl --fail-with-body -sS -H "PRIVATE-TOKEN: $GITLAB_RELEASES_TOKEN" --upload-file "$APK" "$API/$VERSION/$APK"
          jq -n --arg version "$VERSION" --argjson code "$CODE" --arg file "$API/$VERSION/$APK" --arg sha "$SHA" \
            --argjson min "$MIN" --arg notes "$NOTES" \
            '{version: $version, version_code: $code, file_url: $file, sha256: $sha, min_version_code: $min, changelog: $notes}' > update.json
          cat update.json
          curl --fail-with-body -sS -H "PRIVATE-TOKEN: $GITLAB_RELEASES_TOKEN" --upload-file update.json "$API/latest/update.json"
