name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'build*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      NDK_VERSION: 27.2.12479018
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPRESS: 'true'
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install native toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null

      # Private repository runners have 7 GB of memory, and R8 needs more with the build around it.
      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/cogram-swap
          sudo chmod 600 /mnt/cogram-swap
          sudo mkswap /mnt/cogram-swap
          sudo swapon /mnt/cogram-swap
          free -h

      - name: Limit Gradle memory for the runner
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.parallel=false"
          } >> ~/.gradle/gradle.properties

      # Filled by native-cache.yml on main, because caches saved from tag runs are visible only to that tag.
      - name: Restore native object cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ env.NDK_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.NDK_VERSION }}-

      # Release tags must be signed with Phogram's key so they install over earlier releases.
      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOGRAM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PHOGRAM_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Phogram signing secrets are not set"
            case "$GITHUB_REF" in refs/tags/v*) exit 1;; esac
            exit 0
          fi
          # Values pasted into the secrets page can pick up spaces and line breaks, which neither value contains.
          KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \t\r\n')
          echo "::add-mask::$KEYSTORE_PASSWORD"
          export KEYSTORE_PASSWORD
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/phogram-windows.p12"
          echo "Keystore SHA-256: $(sha256sum "$RUNNER_TEMP/phogram-windows.p12" | cut -d' ' -f1)"
          # The key was exported by Windows with legacy encryption, so it is rewritten in a format Java reads.
          if ! openssl pkcs12 -legacy -in "$RUNNER_TEMP/phogram-windows.p12" -passin env:KEYSTORE_PASSWORD -noout; then
            echo "The password secret does not open the keystore secret"
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/phogram.p12"
          openssl pkcs12 -legacy -in "$RUNNER_TEMP/phogram-windows.p12" -passin env:KEYSTORE_PASSWORD -nodes \
            | openssl pkcs12 -export -name phogram -passout env:KEYSTORE_PASSWORD -out "$KEYSTORE"
          rm "$RUNNER_TEMP/phogram-windows.p12"
          LISTING=$(keytool -list -keystore "$KEYSTORE" -storetype pkcs12 -storepass "$KEYSTORE_PASSWORD" 2>&1) || true
          ALIAS=$(printf '%s\n' "$LISTING" | grep -m1 PrivateKeyEntry | cut -d, -f1)
          if [ -z "$ALIAS" ]; then
            printf '%s\n' "$LISTING"
            exit 1
          fi
          {
            echo "PHOGRAM_KEYSTORE_FILE=$KEYSTORE"
            echo "PHOGRAM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PHOGRAM_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build arm64 debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.injected.testOnly=false \
            :TMessagesProj_App:assembleAfatDebug

      - name: Show cache statistics
        if: always()
        run: ccache -s || true

      # The output folder depends on the injected ABI option, so locate the APK instead of naming it.
      - name: Collect APK
        run: |
          mkdir -p dist
          find TMessagesProj_App/build -type f -name '*.apk' -print
          APK=$(find TMessagesProj_App/build -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" dist/cogram-arm64-debug.apk

      # Package installers reject a testOnly APK as invalid, and the injected ABI option turns that flag on by default.
      - name: Check the APK can be installed
        run: |
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs dist/cogram-arm64-debug.apk | grep -v "Signer #1 public key"
          "$TOOLS/aapt2" dump badging dist/cogram-arm64-debug.apk | head -3
          if "$TOOLS/aapt2" dump xmltree --file AndroidManifest.xml dist/cogram-arm64-debug.apk | grep -E 'android:testOnly.*=(true|-1|0xffffffff)'; then
            echo "APK is marked testOnly"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cogram-arm64-debug
          path: dist/cogram-arm64-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Attach APK to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/cogram-arm64-debug.apk "phogram-${GITHUB_REF_NAME}-arm64-debug.apk"
          gh release create "$GITHUB_REF_NAME" "phogram-${GITHUB_REF_NAME}-arm64-debug.apk" \
            --draft --prerelease --title "$GITHUB_REF_NAME" --notes "Automated build of $GITHUB_SHA"
