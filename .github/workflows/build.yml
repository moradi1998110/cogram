name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    # Leave time before the 6h job limit so the ccache step still saves progress.
    timeout-minutes: 340
    env:
      NDK_VERSION: 27.2.12479018
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPRESS: 'true'
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install native toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null

      - name: Limit Gradle memory for the runner
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.parallel=false"
          } >> ~/.gradle/gradle.properties

      - name: Restore native object cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ env.NDK_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.NDK_VERSION }}-

      - name: Build arm64 debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.injected.testOnly=false \
            :TMessagesProj_App:assembleAfatDebug

      - name: Show cache statistics
        if: always()
        run: ccache -s || true

      - name: Save native object cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ env.NDK_VERSION }}-${{ github.run_id }}

      # The output folder depends on the injected ABI option, so locate the APK instead of naming it.
      - name: Collect APK
        run: |
          mkdir -p dist
          find TMessagesProj_App/build -type f -name '*.apk' -print
          APK=$(find TMessagesProj_App/build -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" dist/cogram-arm64-debug.apk

      # Package installers reject a testOnly APK as invalid, and the injected ABI option turns that flag on by default.
      - name: Check the APK can be installed
        run: |
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose dist/cogram-arm64-debug.apk
          "$TOOLS/aapt2" dump badging dist/cogram-arm64-debug.apk | head -3
          if "$TOOLS/aapt2" dump xmltree --file AndroidManifest.xml dist/cogram-arm64-debug.apk | grep -E 'android:testOnly.*=(true|-1|0xffffffff)'; then
            echo "APK is marked testOnly"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cogram-arm64-debug
          path: dist/cogram-arm64-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Attach APK to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/cogram-arm64-debug.apk "cogram-${GITHUB_REF_NAME}-arm64-debug.apk"
          gh release create "$GITHUB_REF_NAME" "cogram-${GITHUB_REF_NAME}-arm64-debug.apk" \
            --draft --prerelease --title "$GITHUB_REF_NAME" --notes "Automated build of $GITHUB_SHA"
