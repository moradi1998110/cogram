name: Compile Java

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.java'
      - '**.kt'
      - '**.gradle'
      - '**.xml'
      - 'gradle.properties'
      - '.github/workflows/check.yml'

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Gradle only needs these two submodules to configure and compile Java, not the native ones.
      - name: Fetch Gradle submodules
        run: git submodule update --init --depth 1 TMessagesProj_Modules/media TMessagesProj/lib/jlatexmath

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # Private repository runners have 7 GB of memory, and R8 needs more with the build around it.
      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/cogram-swap
          sudo chmod 600 /mnt/cogram-swap
          sudo mkswap /mnt/cogram-swap
          sudo swapon /mnt/cogram-swap
          free -h
          df -h / /mnt

      - name: Limit Gradle memory for the runner
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

      - name: Compile
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --continue :xmpp-core:compileDebugJavaWithJavac :TMessagesProj:compileDebugJavaWithJavac :TMessagesProj_App:processAfatDebugResources :TMessagesProj_App:checkAfatDebugDuplicateClasses :TMessagesProj_App:mergeAfatDebugJavaResource :TMessagesProj_App:minifyAfatDebugWithR8
