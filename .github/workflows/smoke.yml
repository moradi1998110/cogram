name: Smoke test

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'smoke*'

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      NDK_VERSION: 27.2.12479018
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPRESS: 'true'
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install native toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null

      - name: Limit Gradle memory for the runner
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx9g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.parallel=false"
          } >> ~/.gradle/gradle.properties

      - name: Restore native object cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-x86_64-${{ env.NDK_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-x86_64-${{ env.NDK_VERSION }}-

      - name: Build x86_64 debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -Pandroid.injected.build.abi=x86_64 \
            -Pandroid.injected.testOnly=false \
            :TMessagesProj_App:assembleAfatDebug

      - name: Save native object cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-x86_64-${{ env.NDK_VERSION }}-${{ github.run_id }}

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find TMessagesProj_App/build -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" dist/cogram-x86_64-debug.apk

      # The emulator needs about 7.4 GB for its userdata partition.
      - name: Free disk space for the emulator
        run: |
          rm -rf .ccache TMessagesProj/.cxx TMessagesProj/build TMessagesProj_App/build TMessagesProj/jni
          sudo rm -rf "$ANDROID_HOME/ndk" /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          df -h "$HOME"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke
          retention-days: 14
