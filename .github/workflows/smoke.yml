name: Smoke test

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'smoke*'
      - 'psmoke*'
      - 'usmoke*'

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      NDK_VERSION: 27.2.12479018
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 4G
      CCACHE_COMPRESS: 'true'
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install native toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null

      # The osmand-poc branch builds OsmAnd's map engine into the Maps tab.
      - name: Fetch OsmAnd
        run: bash .github/scripts/fetch-osmand.sh

      # Private repository runners have 7 GB of memory, and R8 needs more with the build around it.
      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/cogram-swap
          sudo chmod 600 /mnt/cogram-swap
          sudo mkswap /mnt/cogram-swap
          sudo swapon /mnt/cogram-swap
          free -h

      - name: Limit Gradle memory for the runner
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.parallel=false"
          } >> ~/.gradle/gradle.properties

      # Filled by native-cache.yml on main, because caches saved from tag runs are visible only to that tag.
      - name: Restore native object cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-x86_64-${{ env.NDK_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-x86_64-${{ env.NDK_VERSION }}-

      # Releases (v*) and psmoke* tags check the production build type, the one the phones get (its logging calls
      # are removed, so the route timings are missing from steps.txt); the other tags check the debug build.
      # usmoke* tags check the updater: the test build is given the real update address, and its version code is
      # below the latest release's, so the update sheet must open when the app starts.
      - name: Build x86_64 APK
        env:
          GITLAB_API_URL: ${{ vars.GITLAB_API_URL || secrets.GITLAB_API_URL }}
          GITLAB_RELEASES_PROJECT: ${{ vars.GITLAB_RELEASES_PROJECT || secrets.GITLAB_RELEASES_PROJECT }}
          PHOGRAM_XMPP_HOST: ${{ vars.PHOGRAM_XMPP_HOST || secrets.PHOGRAM_XMPP_HOST }}
          PHOGRAM_XMPP_PORT: ${{ vars.PHOGRAM_XMPP_PORT || secrets.PHOGRAM_XMPP_PORT }}
        run: |
          chmod +x gradlew
          TASK=:TMessagesProj_App:assembleAfatDebug
          EXTRA=""
          case "$GITHUB_REF" in
            refs/tags/v*|refs/tags/psmoke*) TASK=:TMessagesProj_App:assembleAfatRelease;;
            refs/tags/usmoke*) EXTRA="-PPHOGRAM_UPDATE_URL=${GITLAB_API_URL%/}/projects/$GITLAB_RELEASES_PROJECT/packages/generic/phogram/latest/update.json";;
          esac
          # The weather on the routes, from the tiles beside the updates (weather.yml), so the trip checks it too.
          if [ -n "$GITLAB_API_URL" ] && [ -n "$GITLAB_RELEASES_PROJECT" ]; then
            EXTRA="$EXTRA -PPHOGRAM_WEATHER_URL=${GITLAB_API_URL%/}/projects/$GITLAB_RELEASES_PROJECT/packages/generic/phogram-weather/latest/index.json"
          fi
          if [ -n "$PHOGRAM_XMPP_HOST" ]; then
            EXTRA="$EXTRA -PPHOGRAM_XMPP_HOST=$PHOGRAM_XMPP_HOST -PPHOGRAM_XMPP_PORT=${PHOGRAM_XMPP_PORT:-5222}"
          fi
          echo "Build: $TASK $EXTRA"
          ./gradlew --no-daemon --stacktrace \
            -Pandroid.injected.build.abi=x86_64 \
            -Pandroid.injected.testOnly=false \
            $EXTRA \
            $TASK

      - name: Show cache statistics
        if: always()
        run: ccache -s || true

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find TMessagesProj_App/build -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" dist/cogram-x86_64-debug.apk

      # The emulator needs about 7.4 GB for its userdata partition.
      - name: Free disk space for the emulator
        run: |
          rm -rf .ccache TMessagesProj/.cxx TMessagesProj/build TMessagesProj_App/build TMessagesProj/jni
          sudo rm -rf "$ANDROID_HOME/ndk" /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          df -h "$HOME"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke
          retention-days: 14
